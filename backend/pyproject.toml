[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contextos"
version = "0.1.0"
description = "ContextOS - a local assistant that organises a student's files, deadlines and week"
requires-python = ">=3.11"

# Phase 00 scaffold: the API and database only. Each later phase opts its
# heavier dependencies in through an extra so the core installs quickly.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# Phase 01. Both providers are called over plain HTTP - no vendor SDKs.
llm = ["httpx>=0.27"]
# Phase 02. PDF text + page rendering, OCR for scanned PDFs, Office files,
# and folder watching. OCR also needs the system binary:
#   sudo apt install tesseract-ocr
ingest = [
    "pymupdf>=1.24",
    "pytesseract>=0.3.13",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "watchdog>=5.0",
]
# Phase 03. Reminder scheduling and desktop notifications.
reminders = ["apscheduler>=3.10,<4", "plyer>=2.1"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
contextos = "contextos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are meant to be declared as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
# One pattern per line keeps the command table readable.
"src/contextos/agent/intents.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
